
name: Build Agent PX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project folder
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f AgentPX-Android/settings.gradle.kts ]; then
            echo "PROJECT_DIR=AgentPX-Android" >> "$GITHUB_ENV"
          else
            echo "Android project not found!"
            exit 1
          fi

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-PX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
